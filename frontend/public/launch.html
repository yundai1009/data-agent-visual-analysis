<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>数据分析 Agent 平台 · 正在启动</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
    /* 降级底色：视频未加载/加载失败时显示深藏青渐变 */
    background:
      radial-gradient(120% 90% at 50% -10%, rgba(143,195,238,.22), transparent 55%),
      radial-gradient(80% 60% at 85% 110%, rgba(15,76,129,.35), transparent 60%),
      linear-gradient(160deg, #16497f 0%, #123f68 55%, #0f2f4f 100%);
    overflow: hidden;
  }
  /* 背景视频：全屏覆盖，加载失败时 body 渐变自然露出 */
  .bg-video {
    position: fixed; inset: 0; z-index: 0;
    width: 100%; height: 100%; object-fit: cover;
  }
  /* 暗色遮罩：保证前景文字对比度（画面本身偏暗，轻遮罩即可） */
  .bg-overlay { position: fixed; inset: 0; z-index: 1; background: rgba(0,0,0,.22); }

  .stage { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 18px; }

  /* ── Logo：柱状图生长（发光） ── */
  .logo { display: flex; align-items: flex-end; gap: 6px; height: 54px; position: relative; }
  .logo::after {
    content: ""; position: absolute; left: -14px; right: -14px; bottom: -2px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.4), transparent);
  }
  .logo i {
    width: 11px; border-radius: 3px 3px 1px 1px;
    background: linear-gradient(180deg, #e3f1fc, #8fc3ee);
    box-shadow: 0 0 18px rgba(143,195,238,.6);
    transform-origin: bottom;
    animation: grow 1.15s cubic-bezier(.3,.9,.4,1) infinite;
  }
  .logo i:nth-child(1) { height: 26px; animation-delay: 0s; }
  .logo i:nth-child(2) { height: 40px; animation-delay: .16s; }
  .logo i:nth-child(3) { height: 54px; animation-delay: .32s; }
  @keyframes grow { 0%, 100% { transform: scaleY(.55); opacity: .75; } 50% { transform: scaleY(1); opacity: 1; } }

  /* ── 标题（发光文字，源自 Serene 模板的 text-glow） ── */
  h1 {
    font-size: 28px; font-weight: 700; letter-spacing: .08em; color: #fff;
    text-shadow: 0 0 40px rgba(255,255,255,.35), 0 0 80px rgba(255,255,255,.18), 0 0 120px rgba(255,255,255,.08);
    animation: fade-in .9s ease both;
  }
  .sub { color: rgba(255,255,255,.66); font-size: 13px; letter-spacing: .28em; animation: fade-in .9s .15s ease both; }

  /* ── 加载条 ── */
  .bar { width: 190px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.16); overflow: hidden; margin-top: 4px; }
  .bar i { display: block; height: 100%; width: 38%; border-radius: 3px; background: linear-gradient(90deg, #8fc3ee, #e8f3fc); animation: slide 1.05s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(300%); } }
  @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ── 状态徽章 ── */
  .status {
    display: flex; align-items: center; gap: 8px; margin-top: 6px;
    font-size: 12px; color: rgba(255,255,255,.6); letter-spacing: .05em;
    animation: fade-in .9s .3s ease both;
  }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: #f59e0b; animation: blink 1.2s ease-in-out infinite; }
  .status.ready .dot { background: #34d399; animation: none; box-shadow: 0 0 8px rgba(52,211,153,.8); }
  @keyframes blink { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }

  /* ── 立即进入按钮（白色 pill + 光晕，源自 Serene 模板 CTA） ── */
  .enter {
    margin-top: 16px; padding: 11px 38px; border-radius: 999px; border: none;
    background: #fff; color: #0a0a0c; font-size: 13px; font-weight: 600; letter-spacing: .12em;
    cursor: pointer; opacity: 0; pointer-events: none; transition: all .25s ease;
    box-shadow: 0 0 20px rgba(255,255,255,.3), 0 0 40px rgba(255,255,255,.12);
  }
  .enter.show { opacity: 1; pointer-events: auto; }
  .enter:hover { background: #f2f2f2; transform: translateY(-1px); box-shadow: 0 0 26px rgba(255,255,255,.42), 0 0 50px rgba(255,255,255,.16); }
  .enter:active { transform: none; }

  .footer { position: fixed; bottom: 22px; width: 100%; text-align: center; color: rgba(255,255,255,.34); font-size: 11px; letter-spacing: .1em; z-index: 2; }

  @media (prefers-reduced-motion: reduce) {
    .logo i, .bar i, .status .dot { animation: none; }
  }
</style>
</head>
<body>
  <video class="bg-video" src="/bg/serene-hero.mp4" poster="/bg/serene-hero-poster.png"
         autoplay muted loop playsinline preload="auto"></video>
  <div class="bg-overlay"></div>
  <div class="stage">
    <div class="logo"><i></i><i></i><i></i></div>
    <h1>数据分析 Agent 平台</h1>
    <div class="sub">正在启动分析引擎</div>
    <div class="bar"><i></i></div>
    <div class="status"><span class="dot"></span><span class="status-text">正在连接后端服务…</span></div>
    <button class="enter" id="enter">立即进入 →</button>
  </div>
  <div class="footer">上传 CSV / Excel · 一句话生成可视化报表</div>

<script>
(function () {
  var statusEl = document.querySelector('.status');
  var statusText = statusEl.querySelector('.status-text');
  var enterBtn = document.getElementById('enter');
  var ready = false;

  // 探测后端就绪 + 判断跳转目标（demo 免登录 → /data；正式未登录 → /login）
  function probe(attempt) {
    fetch('/health', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('not ready'); return r.json(); })
      .then(function (data) {
        ready = true;
        statusEl.classList.add('ready');
        statusText.textContent = '后端服务就绪 · 正在打开应用…';
        enterBtn.classList.add('show');
        setTimeout(go, 600);
      })
      .catch(function () {
        if (attempt > 40) { statusText.textContent = '后端启动超时，请查看启动器日志'; enterBtn.classList.add('show'); return; }
        setTimeout(function () { probe(attempt + 1); }, 500);
      });
  }

  function go() {
    if (go.done) return;
    go.done = true;
    enterBtn.textContent = '进入中…';
    var token = '';
    try { token = localStorage.getItem('token') || ''; } catch (e) {}
    fetch('/auth/me', { cache: 'no-store', headers: { Authorization: 'Bearer ' + token } })
      .then(function (r) {
        // demo 模式（AUTH 关闭）返回 200；正式未登录 401
        window.location.replace(r.ok ? '/data' : '/login');
      })
      .catch(function () { window.location.replace('/login'); });
  }

  enterBtn.addEventListener('click', go);
  probe(0);
})();
</script>
</body>
</html>
