<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数据分析 Agent 平台</title>
    <style>
      /* 启动 splash：React 挂载前的整屏加载动画（与品牌藏青一致，纯 CSS 零依赖） */
      #app-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: radial-gradient(120% 100% at 50% 0%, #1a5b94 0%, #123f68 55%, #0f2f4f 100%);
        transition: opacity .4s ease, visibility .4s;
      }
      #app-splash.splash-fade-out { opacity: 0; visibility: hidden; pointer-events: none; }
      /* 迷你柱状图 logo：3 根柱子生长循环，呼应"数据分析" */
      #app-splash .splash-bars { display: flex; align-items: flex-end; gap: 5px; height: 44px; margin-bottom: 4px; }
      #app-splash .splash-bars i {
        width: 9px; border-radius: 3px 3px 1px 1px;
        background: linear-gradient(180deg, #cfe6f8, #8fc3ee);
        box-shadow: 0 0 12px rgba(143,195,238,.45);
        transform-origin: bottom;
        animation: splash-grow 1.1s ease-in-out infinite;
      }
      #app-splash .splash-bars i:nth-child(1) { height: 22px; animation-delay: 0s; }
      #app-splash .splash-bars i:nth-child(2) { height: 34px; animation-delay: .18s; }
      #app-splash .splash-bars i:nth-child(3) { height: 44px; animation-delay: .36s; }
      @keyframes splash-grow { 0%, 100% { transform: scaleY(.55); } 50% { transform: scaleY(1); } }
      #app-splash .splash-title { color: #fff; font-size: 16px; font-weight: 600; letter-spacing: .06em; }
      #app-splash .splash-sub { color: rgba(255,255,255,.55); font-size: 12px; letter-spacing: .12em; }
      #app-splash .splash-bar { width: 160px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.14); overflow: hidden; }
      #app-splash .splash-bar i { display: block; height: 100%; width: 38%; border-radius: 2px; background: linear-gradient(90deg, #8fc3ee, #e3f1fc); animation: splash-slide 1s ease-in-out infinite; }
      @keyframes splash-grow { 0%, 100% { transform: scaleY(.55); } 50% { transform: scaleY(1); } }
      @keyframes splash-slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(300%); } }
      @media (prefers-reduced-motion: reduce) {
        #app-splash .splash-bars i, #app-splash .splash-bar i { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" aria-hidden="true">
      <div class="splash-bars"><i></i><i></i><i></i></div>
      <div class="splash-title">数据分析 Agent 平台</div>
      <div class="splash-sub">正在启动分析引擎</div>
      <div class="splash-bar"><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
