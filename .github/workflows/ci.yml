# CI 流水线：push 到 main 自动回归（后端测试 + 前端构建/lint + 双冒烟）
# 必须用 windows-latest：PDF 导出测试依赖 C:/Windows/Fonts/msyh.ttc（微软雅黑），Linux/macOS 无此字体。
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch: # 手动触发

jobs:
  backend:
    name: Backend tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend build + lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # lock 的 resolved 全部指向 npmmirror（本地镜像源生成）→ CI 必须用同一 registry
      - name: Use npmmirror registry
        run: npm config set registry https://registry.npmmirror.com

      # lock 由 npm@11.16.0 生成（@emnapi 条目），pin 同一版本避免 npm 小版本行为差异
      - name: Pin npm version
        run: corepack prepare npm@11.16.0 --activate

      - name: Install deps
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Test (vitest)
        working-directory: frontend
        run: npm test

      - name: Lint
        working-directory: frontend
        run: npx oxlint src

  smoke:
    name: E2E smoke (service + browser)
    runs-on: windows-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Use npmmirror registry
        run: npm config set registry https://registry.npmmirror.com

      - name: Pin npm version
        run: corepack prepare npm@11.16.0 --activate

      - name: Install Python deps
        run: python -m pip install -r requirements.txt

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build demo frontend (for smoke)
        working-directory: frontend
        run: npm run build -- --mode demo --outDir dist-demo

      # Playwright 浏览器缓存：windows runner 的 ms-playwright 固定在 runneradmin 用户目录下
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\ms-playwright
          key: playwright-chromium-windows

      # 官方 CDN 在 CI 上不可达（与本地一致），用 npmmirror 镜像（本地验证过同一镜像可用）。
      - name: Install Playwright chromium
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_DOWNLOAD_HOST = "https://cdn.npmmirror.com/binaries/playwright"
          python -m playwright install chromium

      - name: Smoke - service level
        shell: pwsh
        run: |
          $env:DAA_SQLITE_PATH = Join-Path $env:RUNNER_TEMP 'smoke_ci.db'
          $env:FRONTEND_DIST = Join-Path (Get-Location) 'frontend\dist-demo'
          $p = Start-Process python -ArgumentList '-m','uvicorn','api.main:app','--host','127.0.0.1','--port','8010' -PassThru -WindowStyle Hidden -RedirectStandardOutput "$env:RUNNER_TEMP\uvicorn.out.log" -RedirectStandardError "$env:RUNNER_TEMP\uvicorn.err.log"
          try {
            # 轮询 /health 最多 30s（chromadb 等导入较慢，固定 sleep 不可靠）
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $r = Invoke-WebRequest 'http://127.0.0.1:8010/health' -UseBasicParsing -TimeoutSec 2
                if ($r.StatusCode -eq 200) { $ready = $true; break }
              } catch { }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) {
              '::error::uvicorn 启动失败（30s 内 health 未就绪）'
              Get-Content "$env:RUNNER_TEMP\uvicorn.err.log" -ErrorAction SilentlyContinue | Select-Object -Last 25 | ForEach-Object { "::error::$_" }
              exit 1
            }
            python scripts/smoke_e2e.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Smoke - real browser (Playwright)
        run: python scripts/smoke_e2e_browser.py

