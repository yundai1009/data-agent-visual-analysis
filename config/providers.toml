# LLM Provider 配置（参考 Reasonix 的 [[providers]] 接入方式）
# kind: openai（OpenAI 兼容 chat/completions；anthropic 暂未支持，后续扩展）
# api_key_env: 服务端读取该环境变量的值作为该 provider 的 Key（放在项目 .env 或系统环境）；
#              用户页面 BYOK 的 Key 优先级更高（请求头 X-LLM-API-Key > 账号 key > 本 provider Key > 服务端 LLM_API_KEY）
# balance_url: 可选，余额查询接口（预留）

[[providers]]
name        = "deepseek"
kind        = "openai"
base_url    = "https://api.deepseek.com/v1"
models      = ["deepseek-chat", "deepseek-reasoner"]
default     = "deepseek-chat"
api_key_env = "DEEPSEEK_API_KEY"

