# LLM Provider 配置（参考 Reasonix 的 [[providers]] 接入方式）
# 仅收录「官方/知名服务」供应商；你自己的中转站请在页面「自定义供应商」中添加。
# kind: openai（OpenAI 兼容 chat/completions；anthropic 协议暂未支持，故 Claude 官方未列入）
# label: 前端「推荐预设」卡片显示名（中文）
# api_key_env: 服务端读取该环境变量的值作为该 provider 的 Key（放在项目 .env 或系统环境）；
#              用户页面 BYOK 的 Key 优先级更高（请求头 X-LLM-API-Key > 账号 key > 本 provider Key > 服务端 LLM_API_KEY）
# models: 常用模型列表（官方模型会更新，可在配置中扩展；也可 BYOK 后在模型下拉选择）

[[providers]]
name        = "deepseek"
label       = "DeepSeek 官方"
base_url    = "https://api.deepseek.com/v1"
models      = ["deepseek-chat", "deepseek-reasoner"]
default     = "deepseek-chat"
api_key_env = "DEEPSEEK_API_KEY"

[[providers]]
name        = "openai"
label       = "OpenAI 官方"
base_url    = "https://api.openai.com/v1"
models      = ["gpt-4o", "gpt-4o-mini", "gpt-4.1", "gpt-4.1-mini", "o3-mini"]
default     = "gpt-4o-mini"
api_key_env = "OPENAI_API_KEY"

[[providers]]
name        = "gemini"
label       = "Google Gemini"
base_url    = "https://generativelanguage.googleapis.com/v1beta/openai"
models      = ["gemini-2.5-pro", "gemini-2.5-flash", "gemini-2.0-flash", "gemini-1.5-flash"]
default     = "gemini-2.5-flash"
api_key_env = "GEMINI_API_KEY"

[[providers]]
name        = "claude"
label       = "Anthropic Claude（需中转）"
base_url    = "https://api.anthropic.com/v1"
models      = ["claude-sonnet-4-5", "claude-opus-4-5", "claude-haiku-4-5"]
default     = "claude-sonnet-4-5"
api_key_env = "ANTHROPIC_API_KEY"
note        = "官方为 anthropic 协议，需配置 OpenAI 兼容中转（自定义供应商）"

[[providers]]
name        = "mistral"
label       = "Mistral AI"
base_url    = "https://api.mistral.ai/v1"
models      = ["mistral-large-latest", "mistral-medium-latest", "mistral-small-latest", "codestral-latest"]
default     = "mistral-small-latest"
api_key_env = "MISTRAL_API_KEY"

[[providers]]
name        = "groq"
label       = "Groq"
base_url    = "https://api.groq.com/openai/v1"
models      = ["llama-3.3-70b-versatile", "llama-3.1-8b-instant", "mixtral-8x7b-32768"]
default     = "llama-3.3-70b-versatile"
api_key_env = "GROQ_API_KEY"

[[providers]]
name        = "xai"
label       = "xAI Grok"
