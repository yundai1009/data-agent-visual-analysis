{% extends "base.html" %}
{% block title %}数据分析 Agent{% endblock %}

{% block content %}
  <aside class="panel" id="dataset-panel">
    <h2>数据概览</h2>
    <div class="upload-box">
      <label class="upload-label" for="file-input">上传 CSV / Excel</label>
      <input id="file-input" type="file" accept=".csv,.xlsx,.xls" />
      <button id="upload-btn" class="primary">上传并解析</button>
    </div>
    <div id="dataset-summary" class="summary empty">请先上传文件</div>
    <h3 class="sub-title">字段建议</h3>
    <div id="field-advice" class="field-advice empty">上传后自动生成字段建议</div>
    <h3 class="sub-title">数据质量</h3>
    <div id="quality-warnings" class="quality-box empty">上传后显示缺失值、重复行等提示</div>
    <div id="dataset-preview" class="preview-table-wrap"></div>
  </aside>

  <section class="panel" id="config-panel">
    <h2>分析配置</h2>
    <label class="field-label">自然语言分析需求</label>
    <textarea id="analysis-input" rows="5" placeholder="例如：按【工作经验要求】统计占比"></textarea>

    <div class="template-box">
      <div class="field-label">推荐语句模板</div>
      <div id="template-buttons" class="template-buttons"></div>
    </div>

    <div class="chart-selector">
      <div class="field-label">图表类型</div>
      <div id="chart-cards" class="chart-cards"></div>
    </div>

    <div class="field-grid">
      <div>
        <label class="field-label" for="x-axis">X 轴</label>
        <select id="x-axis"></select>
      </div>
      <div>
        <label class="field-label" for="y-axis">Y 轴</label>
        <select id="y-axis" multiple></select>
      </div>
      <div>
        <label class="field-label" for="group-field">分组字段</label>
        <select id="group-field"></select>
      </div>
      <div>
        <label class="field-label" for="agg-method">聚合方式</label>
        <select id="agg-method"></select>
      </div>
    </div>

    <div class="button-row">
      <button id="apply-recommendation-btn" class="ghost">应用推荐字段</button>
      <button id="generate-btn" class="primary">生成报表</button>
      <button id="refresh-btn" class="ghost">重新生成</button>
    </div>

    <div id="validation-hint" class="validation-hint empty">上传文件后开始校验配置</div>
    <div id="config-hint" class="hint">上传文件后，系统会自动推荐字段和图表类型。</div>
  </section>

  <section class="panel" id="result-panel">
    <h2>报表结果</h2>
    <div id="result-meta" class="result-meta empty">等待生成结果</div>
    <div id="recommendation-box" class="recommendation-box empty">生成后展示推荐依据</div>
    <div id="risk-box" class="risk-box empty">生成后展示注意事项</div>
    <div id="agent-trace" class="agent-trace empty">生成后展示 Agent Trace</div>
    <div class="button-row export-row">
      <button id="export-html-btn" class="ghost" disabled>导出 HTML 报告</button>
      <button id="export-json-btn" class="ghost" disabled>导出 JSON</button>
    </div>
    <div id="chart-box" class="chart-box"></div>
    <div class="result-tabs">
      <button class="tab-btn active" data-tab="table">数据表</button>
      <button class="tab-btn" data-tab="conclusion">结论</button>
      <button class="tab-btn" data-tab="raw">原始配置</button>
    </div>
    <div id="tab-table" class="tab-panel"></div>
    <div id="tab-conclusion" class="tab-panel hidden"></div>
    <div id="tab-raw" class="tab-panel hidden"></div>
  </section>
{% endblock %}
